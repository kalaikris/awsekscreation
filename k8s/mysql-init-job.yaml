---
# MySQL Init Job - Creates database tables
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init
spec:
  template:
    spec:
      containers:
      - name: mysql-client
        image: mysql:8.0
        command:
        - /bin/sh
        - -c
        - |
          sleep 30
          mysql -h mysql -u root -ppassword shop -e "
          CREATE TABLE IF NOT EXISTS orders (
            order_id BIGINT PRIMARY KEY,
            items JSON,
            address TEXT,
            payment VARCHAR(50),
            total DECIMAL(10,2),
            status VARCHAR(20)
          );
          CREATE TABLE IF NOT EXISTS tickets (
            id INT AUTO_INCREMENT PRIMARY KEY,
            order_id BIGINT,
            issue TEXT,
            status VARCHAR(20)
          );"
      restartPolicy: Never
  backoffLimit: 3
